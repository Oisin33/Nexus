name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # Can't do a real import check of app/agent because they initialise the
      # Anthropic client, which needs ANTHROPIC_API_KEY. Syntax-check instead.
      - name: Syntax check
        run: python -m py_compile indexer.py retriever.py github_fetcher.py agent.py app.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci requires a lockfile; use npm install instead since we don't
      # commit package-lock.json. The build step catches real dependency issues.
      - run: npm install
      - run: npm run build
