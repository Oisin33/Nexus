[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "F401",   # unused imports — sometimes intentional in __init__ files
]

[tool.ruff.lint.isort]
known-first-party = ["indexer", "retriever", "agent", "github_fetcher"]
